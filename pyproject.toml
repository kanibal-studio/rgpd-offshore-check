[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rgpd-offshore-check"
dynamic = ["version"]
description = "GDPR checklist for outsourcing customer service outside the EU (SCC, TIA, Art. 28, 32, 33). Fail-closed gap report, not legal advice."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ALTA VISTA360, S.L.U." }]
keywords = [
    "gdpr",
    "rgpd",
    "compliance",
    "outsourcing",
    "call-center",
    "bpo",
    "data-protection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Security",
]

[project.scripts]
rgpd-offshore-check = "rgpd_offshore_check:main"

[project.urls]
Homepage = "https://github.com/kanibal-studio/rgpd-offshore-check"
Issues = "https://github.com/kanibal-studio/rgpd-offshore-check/issues"
PyPI = "https://pypi.org/project/rgpd-offshore-check/"

[tool.setuptools]
py-modules = ["rgpd_offshore_check"]

[tool.setuptools.dynamic]
version = { attr = "rgpd_offshore_check.__version__" }
